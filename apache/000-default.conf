# -----------------------------------------------------------
#  [*] Apache — the virtual host
#
#  The one site the image serves: the app's public/ on port
#  8080 (ports.conf), behind the Caddy endpoint. Apache
#  names no version of itself, takes the visitor's address
#  from X-Forwarded-For only when a private address sends
#  it — the access log and PHP then see the visitor, not
#  the endpoint — and builds its own redirects on https.
#  The app's folder lists no folder, follows links —
#  public/upload is one, made by the Dockerfile — and lets
#  public/.htaccess send every path that names no file or
#  folder to index.php. The upload folder runs no PHP
#  whatever a file is called and reads no .htaccess. Both
#  logs go to /var/www/logs, which docker-compose.yml binds
#  to _LOGS/apache/logs on the host.
#
#  Used by:
#    - Dockerfile (this folder) — copies it over the
#      image's own 000-default.conf, the site it enables
#    - ApacheConfigTest (app/tests/Platform) — reads it;
#      the Apache suite checks the same rules over HTTP
# -----------------------------------------------------------

ServerName cyberphish.knf.vu.lt

# Name no version in the Server header or on Apache's own error pages.
# Debian's conf-enabled/security.conf says ServerTokens OS and
# ServerSignature On; this file is read after it, so these win
ServerTokens Prod
ServerSignature Off

# Take the real client IP from X-Forwarded-For, but only when the
# request arrives from the internal Caddy endpoint container — an
# address of the stack's Docker networks, all inside the private
# 172.16.0.0/12
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12

<VirtualHost *:8080>
	ServerAdmin admin@knf.vu.lt
	# TLS ends at the Caddy endpoint: the scheme makes the URLs Apache
	# builds itself — the trailing-slash redirect of public/.htaccess —
	# https ones, not http ones
	ServerName https://cyberphish.knf.vu.lt
	DocumentRoot /var/www/html/public/

	ErrorLog /var/www/logs/error.log
	LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy
	CustomLog /var/www/logs/access.log proxy
</VirtualHost>

<Directory /var/www/html >
	Options -Indexes +FollowSymLinks -MultiViews
	AllowOverride All
	Require all granted
</Directory>
<Directory /var/www/html/public/upload >
	# No .htaccess is read here: one dropped into the folder could
	# redirect its files elsewhere, retype them, or break the folder
	AllowOverride None
	php_admin_value engine Off
	RemoveHandler .php .phtml .phar .php3 .php4 .php5 .php7 .phps
	<FilesMatch "\.ph(p[3457s]?|t|tml|ar)$">
		Require all denied
	</FilesMatch>
</Directory>
